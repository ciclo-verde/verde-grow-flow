name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Runs only on the repository's current default branch (detected automatically).
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build static site (prerender)
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Locate build output and prepare Pages folder
        run: |
          echo "Generated index.html files:"
          find dist .output -name index.html -not -path "*/node_modules/*" 2>/dev/null || true
          OUT=""
          for d in dist/client .output/public dist/public dist; do
            if [ -f "$d/index.html" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then
            F=$(find dist .output -name index.html -not -path "*/server/*" 2>/dev/null | head -n1)
            [ -n "$F" ] && OUT=$(dirname "$F")
          fi
          if [ -z "$OUT" ]; then echo "No prerendered index.html found"; ls -R dist .output 2>/dev/null | head -100; exit 1; fi
          echo "Publishing $OUT"
          rm -rf _site && cp -r "$OUT" _site
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
          rm -f _site/_headers
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
